# Publishes the single-file twins to GitHub Pages (gh-pages branch) whenever they change on main.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "GBPUAT-Campus-3D.html"
      - "GBPUAT-Pantnagar-Digital-Twin.html"
      - "tools/make_site.mjs"
      - "apps/web/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build the new viewer (served under /next/)
        run: |
          npm ci
          npm run build
      - name: Build the site
        run: node tools/make_site.mjs
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
